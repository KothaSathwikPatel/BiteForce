<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <title>FSSAI officer inbox (demo) - BiteTrace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="officer-page">
  <header class="officer-head">
    <div>
      <p class="officer-kicker">DEMO &middot; simulated food safety authority</p>
      <h1>Officer inbox</h1>
    </div>
    <span class="live" id="live"><i aria-hidden="true"></i> Live</span>
  </header>
  <main class="officer-main">
    <p id="counts" class="sub" aria-live="polite"></p>
    <div id="inbox" aria-live="polite"></div>
    <p class="note">This page shows what an officer would receive. Every alert is an unverified request for inspection, not an accusation. Demo data only.</p>
    <a class="btn secondary" href="/">Back to the map</a>
  </main>
  <script type="module" src="/js/officer.js"></script>
</body>
</html>
