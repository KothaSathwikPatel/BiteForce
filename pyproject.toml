[project]
name = "bitetrace"
version = "1.0.0"
description = "Crowdsourced space-time outbreak detection for street food illness"
requires-python = ">=3.11"
   dependencies = [
       "fastapi>=0.110",
       "uvicorn>=0.29",
       "sqlalchemy>=2.0",
       "psycopg2-binary>=2.9",
       "httpx>=0.27",
       "pydantic>=2.6",
   ]
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "S311"]
"app/seed.py" = ["S311"]  # non-cryptographic randomness for demo data
"app/service.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/asgi.py"]
